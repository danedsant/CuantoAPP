            <svg class="api-status__badge-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm0-11a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 5zm0 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>

          <div class="api-status__date" id="estado-api">
            <span class="api-status__date-line api-status__date-line--weekday" id="estado-weekday"></span>
            <span class="api-status__date-line api-status__date-line--day api-status__date-line--loading" id="estado-day">Cargando tasas del día...</span>
            <span class="api-status__date-line api-status__date-line--meta" id="estado-meta"></span>
